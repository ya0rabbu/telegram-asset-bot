services:
  - type: web
    name: bangaliicon-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python unified_asset_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
