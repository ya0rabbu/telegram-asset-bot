<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Bangali Icon · Effects Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/telegram-webapp/1.0.0/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f2e27; --surface:#153a31; --surface-2:#1c463c; --surface-3:#20544a;
    --text:#f2f6df; --muted:#8fae9f; --line:#255145;
    --accent:#eaf76b; --accent-2:#8ee6c7; --accent-dim:#3d5c3a; --danger:#ff6b5e;
    --accent-ink:#12241a;
    --sheet-h: 46vh;
    --header-h: 60px;
    --footer-h: 68px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6ec; --surface:#ffffff; --surface-2:#eaeedb; --surface-3:#dfe6cd;
      --text:#122b23; --muted:#5d7568; --line:#d9e2ce;
      --accent:#12241a; --accent-2:#0f6b4e; --accent-dim:#eaf76b; --accent-ink:#f4f6ec;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f2e27; --surface:#153a31; --surface-2:#1c463c; --surface-3:#20544a;
    --text:#f2f6df; --muted:#8fae9f; --line:#255145;
    --accent:#eaf76b; --accent-2:#8ee6c7; --accent-dim:#3d5c3a; --accent-ink:#12241a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; overflow-x:clip; overscroll-behavior:none; }
  html{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    height:100dvh; height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  svg.icon{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto; height:var(--header-h);
    padding:0 14px; padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .bot-badge{ display:flex; align-items:center; gap:10px; min-width:0; }
  .bot-logo{
    width:36px; height:36px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(150deg,#eaf76b,#8ee6c7);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(234,247,107,.25);
  }
  .bot-logo svg{ width:20px; height:20px; stroke:#12241a; stroke-width:2; }
  .bot-text{ line-height:1.15; min-width:0; }
  .bot-text .name-row{ display:flex; align-items:center; gap:6px; }
  .bot-text h1{ margin:0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot-live{ width:7px; height:7px; border-radius:50%; background:#4ee08a; flex:0 0 auto; box-shadow:0 0 0 2px rgba(78,224,138,.2); }
  .bot-text .sub{ font-size:11px; color:var(--muted); font-style:italic; }

  .credits-pill{
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
    padding:6px 10px 6px 8px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    cursor:pointer;
  }
  .credits-pill svg{ width:16px; height:16px; stroke:var(--accent); }
  .credits-pill .num{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; }
  .credits-pill.low .num{ color:var(--danger); }

  /* ---------- MAIN / STAGE ---------- */
  main{ flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column; }
  .stage{
    flex:1 1 auto; min-height:0;
    margin:10px 12px 8px; border-radius:16px; overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  canvas{ max-width:100%; max-height:100%; width:auto; height:auto; display:block; image-rendering:pixelated; }
  .stage.empty{ cursor:pointer; }
  .dropcopy{ text-align:center; color:var(--muted); font-size:14px; padding:0 28px; }
  .dropcopy svg{ width:38px; height:38px; stroke:var(--accent); margin:0 auto 10px; }
  .dropcopy .mono{ display:block; margin-top:8px; color:var(--accent); font-size:11px; }
  input[type=file]{ display:none; }

  .status-pill{
    position:absolute; top:10px; left:10px;
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--accent);
    background:rgba(0,0,0,.35); padding:4px 9px; border-radius:999px;
    pointer-events:none; max-width:calc(100% - 20px); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .stage-actions{ position:absolute; top:10px; right:10px; display:flex; gap:6px; }
  .stage-icon-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:rgba(0,0,0,.35); color:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .stage-icon-btn svg{ width:16px; height:16px; }

  /* ---------- FX RAIL ---------- */
  .rail-row{ display:flex; align-items:center; gap:8px; padding:0 12px 10px; }
  .rail{
    flex:1 1 auto; display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{ display:none; }
  .fx-chip{
    flex:0 0 auto; scroll-snap-align:start;
    min-height:38px; padding:0 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:13px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:border-color .15s, color .15s, background .15s;
    display:flex; align-items:center; gap:6px;
  }
  .fx-chip svg{ width:14px; height:14px; }
  .fx-chip[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent); font-weight:700; }
  .grid-btn{
    flex:0 0 auto; width:38px; height:38px; border-radius:11px;
    border:1px solid var(--line); background:var(--surface); color:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .grid-btn svg{ width:17px; height:17px; }

  /* ---------- CONTROLS SHEET ---------- */
  .sheet{
    flex:0 0 auto; background:var(--surface-2); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; max-height:var(--sheet-h);
    display:flex; flex-direction:column; transition:max-height .22s ease;
  }
  .sheet.collapsed{ max-height:44px; }
  .sheet-handle{ flex:0 0 auto; height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; cursor:pointer; }
  .sheet-handle .title{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .sheet-handle svg{ width:14px; height:14px; color:var(--muted); transition:transform .2s; }
  .sheet.collapsed .sheet-handle svg{ transform:rotate(180deg); }
  .sheet-body{ padding:2px 16px 14px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .color-row{ display:flex; gap:10px; margin-bottom:16px; }
  .color-field{ flex:1; }
  .color-field label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  .swatch-input{ position:relative; height:38px; border-radius:10px; border:1px solid var(--line); overflow:hidden; }
  .swatch-input input[type=color]{ position:absolute; inset:0; width:100%; height:100%; border:none; padding:0; cursor:pointer; background:none; }

  .slider-row{ margin-bottom:16px; }
  .slider-row .label-line{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:8px; }
  .slider-row .val{ color:var(--accent); font-weight:600; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:28px; background:transparent; outline:none; }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:3px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; margin-top:-11px; width:26px; height:26px; border-radius:50%; background:var(--accent); border:4px solid var(--bg); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.35); }
  input[type=range]::-moz-range-track{ height:5px; border-radius:3px; background:var(--line); }
  input[type=range]::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; border:4px solid var(--bg); background:var(--accent); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* ---------- FOOTER ---------- */
  .footer-bar{ flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  button.primary, button.ghost{ border:none; border-radius:14px; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; cursor:pointer; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; }
  button.primary{ flex:1; background:var(--accent); color:var(--accent-ink); }
  button.primary:disabled{ background:var(--surface-2); color:var(--muted); }
  button.ghost{ flex:0 0 48px; background:var(--surface); color:var(--text); border:1px solid var(--line); }
  button.ghost svg{ width:19px; height:19px; }
  button.primary svg{ width:18px; height:18px; }

  /* ---------- MODALS (gallery + export) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{
    width:100%; max-height:82vh; background:var(--surface-2); border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; transform:translateY(16px); transition:transform .2s;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .modal-overlay.open .modal-sheet{ transform:translateY(0); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .modal-head h2{ margin:0; font-size:16px; }
  .modal-close{ width:32px; height:32px; border-radius:9px; background:var(--surface); border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .modal-close svg{ width:16px; height:16px; }
  .modal-body{ padding:14px 16px; overflow-y:auto; }

  .fx-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .fx-cell{ background:none; border:2px solid var(--line); border-radius:14px; padding:0; overflow:hidden; cursor:pointer; text-align:left; }
  .fx-cell.active{ border-color:var(--accent); }
  .fx-cell img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--surface); }
  .fx-cell span{ display:block; font-size:11px; padding:6px 8px; color:var(--muted); font-weight:600; }
  .fx-cell.active span{ color:var(--accent); }

  .export-field{ margin-bottom:18px; }
  .export-field .label-line{ font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button{ flex:1; border:none; background:var(--surface); color:var(--muted); padding:10px 0; font-family:'Space Grotesk'; font-weight:600; font-size:13px; cursor:pointer; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); }
  .export-preview-note{ font-size:11px; color:var(--muted); margin-top:6px; }

  .toast{
    position:fixed; left:50%; bottom:calc(var(--footer-h) + 18px); transform:translateX(-50%);
    background:var(--surface-3); color:var(--text); padding:10px 16px; border-radius:999px;
    font-size:12.5px; border:1px solid var(--line); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
</style>
</head>
<body>

<header>
  <div class="bot-badge">
    <div class="bot-logo">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke-linejoin="round"/></svg>
    </div>
    <div class="bot-text">
      <div class="name-row">
        <h1>Bangali Icon</h1>
        <span class="dot-live"></span>
      </div>
      <div class="sub">bot</div>
    </div>
  </div>
  <div class="credits-pill mono" id="creditsPill">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12.5 11 14.5 15.5 9.5"/></svg>
    <span class="num" id="creditsNum">--</span>
  </div>
</header>

<main>
  <div class="stage empty" id="stage">
    <canvas id="canvas" width="800" height="800" style="display:none"></canvas>
    <div class="dropcopy" id="dropcopy">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
      Tap to choose a photo
      <span class="mono">JPG or PNG · processed on your device</span>
    </div>
    <span class="status-pill mono" id="status">ready</span>
    <div class="stage-actions">
      <button class="stage-icon-btn" id="resetBtn" title="Reset">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
      </button>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="rail-row">
    <div class="rail" id="fxRail"></div>
    <button class="grid-btn" id="openGallery" title="See all effects">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
  </div>
</main>

<div class="sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle">
    <span class="title" id="sheetTitle">Adjust</span>
    <svg viewBox="0 0 24 24"><path d="M18 15 12 9l-6 6"/></svg>
  </div>
  <div class="sheet-body" id="controls"></div>
</div>

<div class="footer-bar">
  <button class="ghost" id="sendBtn" disabled title="Send to bot">
    <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </button>
  <button class="primary" id="exportBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Export
  </button>
</div>

<!-- Gallery modal -->
<div class="modal-overlay" id="galleryOverlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>All effects</h2>
      <button class="modal-close" id="closeGallery"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body"><div class="fx-grid" id="fxGrid"></div></div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="exportOverlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Export</h2>
      <button class="modal-close" id="closeExport"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="export-field">
        <div class="label-line"><span>Format</span></div>
        <div class="seg" id="formatSeg">
          <button data-v="jpeg" class="active">JPEG</button>
          <button data-v="png">PNG</button>
          <button data-v="webp">WEBP</button>
        </div>
      </div>
      <div class="export-field" id="qualityField">
        <div class="label-line"><span>Quality</span><span class="val mono" id="qualityVal">0.9</span></div>
        <input type="range" id="qualitySlider" min="0.4" max="1" step="0.05" value="0.9">
      </div>
      <div class="export-field">
        <div class="label-line"><span>Resolution</span></div>
        <div class="seg" id="scaleSeg">
          <button data-v="1">1×</button>
          <button data-v="2" class="active">2×</button>
          <button data-v="3">3×</button>
        </div>
        <div class="export-preview-note" id="resNote">Renders at high resolution using your original photo.</div>
      </div>
    </div>
    <div class="footer-bar" style="border-top:1px solid var(--line);">
      <button class="primary" id="downloadBtn">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Download image
      </button>
    </div>
  </div>
</div>

<div class="toast mono" id="toast"></div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready(); tg.expand();
    document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light");
  }

  /* ============ CREDITS ============
     Mocked locally for now. To connect to the real Bangali Icon bot backend:
     replace fetchCredits()/spendCredit() with a call to your bot's API,
     e.g. using tg.initDataUnsafe.user.id to look up the balance, or
     tg.sendData({type:"get_credits"}) if your bot pushes it back via webhook. */
  var CREDIT_COST = 1;
  function fetchCredits(){
    var v = localStorage.getItem("bi_credits");
    return v === null ? 20 : parseInt(v, 10);
  }
  function setCredits(v){
    localStorage.setItem("bi_credits", String(Math.max(0, v)));
    paintCredits();
  }
  function paintCredits(){
    var c = fetchCredits();
    document.getElementById("creditsNum").textContent = c;
    document.getElementById("creditsPill").classList.toggle("low", c <= CREDIT_COST);
  }
  paintCredits();

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ============ STATE ============ */
  var srcImage = null;
  var srcCanvas = document.createElement("canvas");
  var srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var dropcopy = document.getElementById("dropcopy");
  var fileInput = document.getElementById("fileInput");
  var statusEl = document.getElementById("status");
  var sendBtn = document.getElementById("sendBtn");
  var exportBtn = document.getElementById("exportBtn");
  var resetBtn = document.getElementById("resetBtn");
  var fxRail = document.getElementById("fxRail");
  var controls = document.getElementById("controls");

  var WORK_SIZE = 640;
  var activeFx = "ascii";

  var ICONS = {
    ascii:"M4 5h16M4 12h16M4 19h10", halftone:"M6 6a2 2 0 1 1 0 .001M12 6a3 3 0 1 1 0 .001M18 12a2 2 0 1 1 0 .001M9 15a2.5 2.5 0 1 1 0 .001",
    dither:"M4 6h4M12 6h4M4 12h4M12 12h4M4 18h4M12 18h4", matrix:"M6 4v16M12 4v16M18 4v16",
    dots:"M7 7a2 2 0 1 1 0 .001M17 7a2 2 0 1 1 0 .001M7 17a2 2 0 1 1 0 .001M17 17a2 2 0 1 1 0 .001M12 12a2 2 0 1 1 0 .001",
    contour:"M12 3c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9Z", pixelsort:"M4 6h16M4 12h10M4 18h13",
    blockify:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", threshold:"M12 3v18M4 12h16",
    edges:"M4 12h4l2-6 3 12 2-9 1 3h4", crosshatch:"M6 4v16M18 4v16M4 8h16M4 16h16",
    wavelines:"M3 8c2-3 4 3 6 0s4 3 6 0 4 3 6 0M3 16c2-3 4 3 6 0s4 3 6 0 4 3 6 0",
    noisefield:"M5 5h3v3H5zM11 5h3v3h-3zM17 5h3v3h-3zM5 11h3v3H5zM11 11h3v3h-3zM17 11h3v3h-3z",
    voronoi:"M12 3 4 9l3 12h10l3-12Z", vhs:"M3 8h18M3 12h18M3 16h12"
  };

  var EFFECTS = [
    { id:"ascii",     label:"ASCII" },
    { id:"dither",    label:"Dithering" },
    { id:"halftone",  label:"Halftone" },
    { id:"matrix",    label:"Matrix Rain" },
    { id:"dots",      label:"Dots" },
    { id:"contour",   label:"Contour" },
    { id:"pixelsort", label:"Pixel Sort" },
    { id:"blockify",  label:"Blockify" },
    { id:"threshold", label:"Threshold" },
    { id:"edges",     label:"Edge Detection" },
    { id:"crosshatch",label:"Crosshatch" },
    { id:"wavelines", label:"Wave Lines" },
    { id:"noisefield",label:"Noise Field" },
    { id:"voronoi",   label:"Voronoi" },
    { id:"vhs",       label:"VHS" },
  ];

  /* size-like keys get scaled up automatically when exporting at 2x/3x */
  var SIZE_KEYS = { cell:1, spacing:1, scale:1, lineWidth:1, edgeWidth:1, amplitude:1 };

  var PARAMS = {
    ascii:     { cell:{label:"Cell size", min:4, max:20, step:1, val:9},
                 contrast:{label:"Contrast", min:0.5, max:2, step:0.05, val:1.1} },
    halftone:  { cell:{label:"Dot pitch", min:4, max:24, step:1, val:10},
                 contrast:{label:"Contrast", min:0.5, max:2, step:0.05, val:1.15} },
    dither:    { levels:{label:"Color levels", min:2, max:8, step:1, val:4},
                 contrast:{label:"Contrast", min:0.5, max:2, step:0.05, val:1.1} },
    pixelsort: { threshold:{label:"Threshold", min:0, max:255, step:1, val:110},
                 amount:{label:"Row range", min:5, max:100, step:1, val:60} },
    vhs:       { intensity:{label:"Distortion", min:0, max:20, step:1, val:6},
                 scanline:{label:"Scanline strength", min:0, max:1, step:0.05, val:0.35} },
    matrix:    { density:{label:"Glyph density", min:6, max:22, step:1, val:12},

    dots:      { cell:{label:"Dot spacing", min:4, max:24, step:1, val:9},

                 contrast:{label:"Contrast", min:0.5, max:2, step:0.05, val:1.1} },
    contour:   { levels:{label:"Bands", min:2, max:12, step:1, val:6},
                 lineWidth:{label:"Line weight", min:1, max:4, step:0.5, val:1.5} },
    blockify:  { cell:{label:"Block size", min:4, max:40, step:1, val:16} },
    threshold: { level:{label:"Threshold", min:0, max:255, step:1, val:128} },
    edges:     { strength:{label:"Sensitivity", min:0.2, max:3, step:0.1, val:1.2},

    crosshatch:{ cell:{label:"Cell size", min:4, max:20, step:1, val:8},

    noisefield:{ scale:{label:"Cell size", min:2, max:16, step:1, val:5},

    voronoi:   { cell:{label:"Cell size", min:8, max:60, step:1, val:24},
                 edgeWidth:{label:"Edge width", min:0, max:2, step:0.1, val:0.4},
                 randomize:{label:"Randomize", min:0, max:1, step:0.05, val:0.3} },
  };
  var DEFAULT_PARAMS = JSON.parse(JSON.stringify(PARAMS));

  /* two-tone effects get customizable foreground/background colors */
  var COLORS = {
    ascii:{ bg:"#0f2e27", fg:"#eaf76b" },
    halftone:{ bg:"#f4f2ea", fg:"#0b0e0c" },
    dots:{ bg:"#0f2e27", fg:"#eaf76b" },
    contour:{ bg:"#0f2e27", fg:"#eaf76b" },
    threshold:{ bg:"#0f2e27", fg:"#eaf76b" },
    crosshatch:{ bg:"#f4f2ea", fg:"#0f2e27" },
    wavelines:{ bg:"#0f2e27", fg:"#eaf76b" },
    matrix:{ bg:"#0f2e27", fg:"#eaf76b" },
  };
  var DEFAULT_COLORS = JSON.parse(JSON.stringify(COLORS));

  function hexToRgb(hex){
    var v = parseInt(hex.replace("#",""),16);
    return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 };
  }

  EFFECTS.forEach(function(fx){
    var chip = document.createElement("button");
    chip.className = "fx-chip";
    chip.setAttribute("aria-pressed", fx.id === activeFx ? "true" : "false");
    chip.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="'+ICONS[fx.id]+'"/></svg><span>'+fx.label+'</span>';
    chip.addEventListener("click", function(){ selectFx(fx.id); });
    chip.dataset.fx = fx.id;
    fxRail.appendChild(chip);
  });

  function selectFx(id){
    activeFx = id;
    Array.prototype.forEach.call(fxRail.children, function(c){
      c.setAttribute("aria-pressed", c.dataset.fx === id ? "true" : "false");
    });
    buildControls();
    render();
  }

  var sheet = document.getElementById("sheet");
  document.getElementById("sheetHandle").addEventListener("click", function(){ sheet.classList.toggle("collapsed"); });

  function buildControls(){
    controls.innerHTML = "";
    document.getElementById("sheetTitle").textContent = "Adjust · " + activeFx;

    if (COLORS[activeFx]) {
      var row = document.createElement("div");
      row.className = "color-row";
      ["bg","fg"].forEach(function(k){
        var field = document.createElement("div");
        field.className = "color-field";
        var lab = document.createElement("label");
        lab.textContent = k === "bg" ? "Background" : "Foreground";
        var wrap = document.createElement("div");
        wrap.className = "swatch-input";
        wrap.style.background = COLORS[activeFx][k];
        var input = document.createElement("input");
        input.type = "color";
        input.value = COLORS[activeFx][k];
        input.addEventListener("input", function(){
          COLORS[activeFx][k] = input.value;
          wrap.style.background = input.value;
          render();
        });
        wrap.appendChild(input);
        field.appendChild(lab); field.appendChild(wrap);
        row.appendChild(field);
      });
      controls.appendChild(row);
    }

    var group = PARAMS[activeFx];
    Object.keys(group).forEach(function(key){
      var p = group[key];
      var srow = document.createElement("div");
      srow.className = "slider-row";
      var labelLine = document.createElement("div");
      labelLine.className = "label-line";
      var label = document.createElement("span"); label.textContent = p.label;
      var val = document.createElement("span"); val.className = "val mono"; val.textContent = formatVal(p.val);
      labelLine.appendChild(label); labelLine.appendChild(val);

      var slider = document.createElement("input");
      slider.type = "range"; slider.min = p.min; slider.max = p.max; slider.step = p.step; slider.value = p.val;
      slider.addEventListener("input", function(){
        p.val = parseFloat(slider.value);
        val.textContent = formatVal(p.val);

      });
      srow.appendChild(labelLine); srow.appendChild(slider);
      controls.appendChild(srow);
    });
  }
  function formatVal(v){ return (Math.round(v * 100) / 100).toString(); }

  /* ============ IMAGE LOADING ============ */
  stage.addEventListener("click", function(){ if (!srcImage) fileInput.click(); });
  fileInput.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        srcImage = img;
        var scale = Math.min(WORK_SIZE / img.width, WORK_SIZE / img.height, 1);
        srcCanvas.width = Math.max(1, Math.round(img.width * scale));
        srcCanvas.height = Math.max(1, Math.round(img.height * scale));
        srcCtx.drawImage(img, 0, 0, srcCanvas.width, srcCanvas.height);

        canvas.width = srcCanvas.width; canvas.height = srcCanvas.height;
        canvas.style.display = "block"; dropcopy.style.display = "none";
        stage.classList.remove("empty");
        sendBtn.disabled = false; exportBtn.disabled = false;
        buildControls(); render();
        setStatus("image loaded — " + srcCanvas.width + "×" + srcCanvas.height);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  resetBtn.addEventListener("click", function(){
    srcImage = null;
    canvas.style.display = "none"; dropcopy.style.display = "block";
    stage.classList.add("empty");
    sendBtn.disabled = true; exportBtn.disabled = true;
    fileInput.value = "";
    PARAMS = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
    COLORS = JSON.parse(JSON.stringify(DEFAULT_COLORS));
    activeFx = "ascii"; selectFx("ascii");
    setStatus("ready");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  });

  function setStatus(msg){ statusEl.textContent = msg; }

  /* ============ RENDER PIPELINE ============
     applyEffect() is pure: (id, imageData, w, h, paramVals, colors) -> imageData
     It's reused for the live preview, the "all effects" thumbnails, and export. */
  function paramVals(id, scaleFactor){
    var out = {}, group = PARAMS[id];
    Object.keys(group).forEach(function(k){
      var v = group[k].val;
      if (scaleFactor && SIZE_KEYS[k]) v = v * scaleFactor;
      out[k] = v;
    });
    return out;
  }

  function render(){
    if (!srcImage) return;
    var w = srcCanvas.width, h = srcCanvas.height;
    var frame = srcCtx.getImageData(0, 0, w, h);
    var out = applyEffect(activeFx, frame, w, h, paramVals(activeFx), COLORS[activeFx]);
    ctx.putImageData(out, 0, 0);
    setStatus(activeFx + " applied · " + w + "×" + h);
  }

  function applyEffect(id, frame, w, h, p, c){
    switch(id){
      case "ascii":     return renderAscii(frame, w, h, p, c);
      case "halftone":  return renderHalftone(frame, w, h, p, c);
      case "dither":    return renderDither(frame, w, h, p);
      case "pixelsort": return renderPixelSort(frame, w, h, p);
      case "vhs":       return renderVHS(frame, w, h, p);
      case "matrix":    return renderMatrix(frame, w, h, p, c);
      case "dots":      return renderDots(frame, w, h, p, c);
      case "contour":   return renderContour(frame, w, h, p, c);
      case "blockify":  return renderBlockify(frame, w, h, p);
      case "threshold": return renderThreshold(frame, w, h, p, c);
      case "edges":     return renderEdges(frame, w, h, p);
      case "crosshatch":return renderCrosshatch(frame, w, h, p, c);
      case "wavelines": return renderWaveLines(frame, w, h, p, c);
      case "noisefield":return renderNoiseField(frame, w, h, p);
      case "voronoi":   return renderVoronoi(frame, w, h, p);
      default:          return frame;
    }
  }

  function luma(r,g,b){ return 0.2126*r + 0.7152*g + 0.0722*b; }
  function applyContrast(v, c){ return Math.min(255, Math.max(0, (v - 128) * c + 128)); }

  function renderAscii(frame, w, h, p, c){
    var ramp = " .:-=+*#%@";
    var bg = hexToRgb(c.bg);
    ctx.fillStyle = c.bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = c.fg;
    ctx.font = Math.floor(p.cell*1.2) + "px monospace"; ctx.textBaseline = "top";
    var data = frame.data;
    for (var y = 0; y < h; y += p.cell) {
      for (var x = 0; x < w; x += p.cell) {
        var idx = (y * w + x) * 4;
        var l = applyContrast(luma(data[idx], data[idx+1], data[idx+2]), p.contrast);
        var ch = ramp[Math.min(ramp.length-1, Math.floor((l/255) * (ramp.length-1)))];
        ctx.fillText(ch, x, y);
      }
    }
    return ctx.getImageData(0, 0, w, h);
  }

  function renderHalftone(frame, w, h, p, c){
    var data = frame.data;
    ctx.fillStyle = c.bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = c.fg;
    for (var y = 0; y < h; y += p.cell) {
      for (var x = 0; x < w; x += p.cell) {
        var idx = (y * w + x) * 4;
        var l = applyContrast(luma(data[idx], data[idx+1], data[idx+2]), p.contrast);
        var dark = 1 - (l/255);
        var r = (p.cell/2) * Math.sqrt(dark);
        if (r > 0.4) { ctx.beginPath(); ctx.arc(x + p.cell/2, y + p.cell/2, r, 0, Math.PI*2); ctx.fill(); }
      }
    }
    return ctx.getImageData(0, 0, w, h);
  }

  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function renderDither(frame, w, h, p){
    var levels = Math.round(p.levels);
    var out = ctx.createImageData(w, h);
    var data = frame.data, od = out.data;
    var step = 255 / (levels - 1);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var idx = (y * w + x) * 4;
        var threshold = (BAYER[y%4][x%4] / 16 - 0.5) * step;
        for (var c2 = 0; c2 < 3; c2++) {
          var v = applyContrast(data[idx+c2], p.contrast) + threshold;
          v = Math.round(v / step) * step;
          od[idx+c2] = Math.min(255, Math.max(0, v));
        }
        od[idx+3] = 255;
      }
    }
    return out;
  }

  function renderPixelSort(frame, w, h, p){
    var out = new ImageData(new Uint8ClampedArray(frame.data), w, h);
    var data = out.data;
    var rowsToSort = Math.round(h * (p.amount/100));
    var startRow = Math.floor((h - rowsToSort) / 2);
    for (var y = startRow; y < startRow + rowsToSort && y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) { var idx = (y * w + x) * 4; row.push([data[idx], data[idx+1], data[idx+2], data[idx+3]]); }
      var i = 0;
      while (i < w) {
        var l = luma(row[i][0], row[i][1], row[i][2]);
        if (l > p.threshold) {
          var j = i;
          while (j < w && luma(row[j][0], row[j][1], row[j][2]) > p.threshold) j++;
          var slice = row.slice(i, j);
          slice.sort(function(a,b){ return luma(a[0],a[1],a[2]) - luma(b[0],b[1],b[2]); });
          for (var k = 0; k < slice.length; k++) row[i+k] = slice[k];
          i = j;
        } else { i++; }
      }
      for (var x2 = 0; x2 < w; x2++) { var idx2 = (y * w + x2) * 4; data[idx2]=row[x2][0]; data[idx2+1]=row[x2][1]; data[idx2+2]=row[x2][2]; data[idx2+3]=255; }
    }
    return out;
  }

  function renderDots(frame, w, h, p, c){
    var data = frame.data;
    var fgRgb = hexToRgb(c.fg);
    ctx.fillStyle = c.bg; ctx.fillRect(0,0,w,h);
    for (var y = 0; y < h; y += p.cell) {
      for (var x = 0; x < w; x += p.cell) {
        var idx = (y * w + x) * 4;
        var l = applyContrast(luma(data[idx], data[idx+1], data[idx+2]), p.contrast);
        var t = l / 255;
        ctx.fillStyle = "rgba(" + fgRgb.r + "," + fgRgb.g + "," + fgRgb.b + "," + (0.15 + t*0.85) + ")";
        var r = (p.cell/2) * p.sizeMul * (0.3 + t*0.7);
        ctx.beginPath(); ctx.arc(x + p.cell/2, y + p.cell/2, r, 0, Math.PI*2); ctx.fill();
      }
    }
    return ctx.getImageData(0, 0, w, h);
  }

  function renderContour(frame, w, h, p, c){
    var levels = Math.round(p.levels);
    var data = frame.data;
    var bandOf = new Int16Array(w*h);
    for (var px = 0; px < w*h; px++) { var i4 = px*4; bandOf[px] = Math.floor((luma(data[i4],data[i4+1],data[i4+2])/255) * levels); }
    var out = ctx.createImageData(w, h); var od = out.data;
    var bgRgb = hexToRgb(c.bg), fgRgb = hexToRgb(c.fg);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var p2 = y*w+x, i5 = p2*4;
        var b = bandOf[p2];
        var isEdge = (x+1<w && bandOf[p2+1] !== b) || (y+1<h && bandOf[p2+w] !== b);
        if (isEdge && p.lineWidth > 0) { od[i5]=fgRgb.r; od[i5+1]=fgRgb.g; od[i5+2]=fgRgb.b; }
        else {
          var shade = (b/(levels-1||1));
          od[i5]=bgRgb.r + shade*20; od[i5+1]=bgRgb.g + shade*20; od[i5+2]=bgRgb.b + shade*20;
        }
        od[i5+3]=255;
      }
    }
    return out;
  }

  function renderBlockify(frame, w, h, p){
    var cell = Math.round(p.cell);
    var data = frame.data;
    var out = ctx.createImageData(w, h); var od = out.data;
    for (var by = 0; by < h; by += cell) {
      for (var bx = 0; bx < w; bx += cell) {
        var rs=0,gs=0,bs=0,count=0;
        for (var y = by; y < Math.min(h, by+cell); y++) for (var x = bx; x < Math.min(w, bx+cell); x++) { var idx=(y*w+x)*4; rs+=data[idx]; gs+=data[idx+1]; bs+=data[idx+2]; count++; }
        var ar=rs/count, ag=gs/count, ab=bs/count;
        for (var y2 = by; y2 < Math.min(h, by+cell); y2++) for (var x2 = bx; x2 < Math.min(w, bx+cell); x2++) { var idx2=(y2*w+x2)*4; od[idx2]=ar; od[idx2+1]=ag; od[idx2+2]=ab; od[idx2+3]=255; }
      }
    }
    return out;
  }

  function renderThreshold(frame, w, h, p, c){
    var data = frame.data;
    var out = ctx.createImageData(w, h); var od = out.data;
    var bgRgb = hexToRgb(c.bg), fgRgb = hexToRgb(c.fg);
    for (var px = 0; px < w*h; px++) {
      var i4 = px*4;
      var l = luma(data[i4], data[i4+1], data[i4+2]);
      var rgb = l > p.level ? fgRgb : bgRgb;
      od[i4]=rgb.r; od[i4+1]=rgb.g; od[i4+2]=rgb.b; od[i4+3]=255;
    }
    return out;
  }

  function renderEdges(frame, w, h, p){
    var data = frame.data;
    var gray = new Float32Array(w*h);
    for (var px = 0; px < w*h; px++) { var i4 = px*4; gray[px] = luma(data[i4], data[i4+1], data[i4+2]); }
    var gx = [-1,0,1,-2,0,2,-1,0,1], gy = [-1,-2,-1,0,0,0,1,2,1];
    var out = ctx.createImageData(w, h); var od = out.data;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var sx=0, sy=0, k=0;
        for (var dy=-1; dy<=1; dy++) for (var dx=-1; dx<=1; dx++) { var yy=Math.min(h-1,Math.max(0,y+dy)), xx=Math.min(w-1,Math.max(0,x+dx)); var v=gray[yy*w+xx]; sx+=v*gx[k]; sy+=v*gy[k]; k++; }
        var mag = Math.min(255, Math.sqrt(sx*sx+sy*sy) * p.strength);
        if (p.invert > 0.5) mag = 255 - mag;
        var idx = (y*w+x)*4;
        od[idx]=15+mag*0.86; od[idx+1]=46+mag*0.79; od[idx+2]=39+mag*0.27; od[idx+3]=255;
      }
    }
    return out;
  }

  function renderCrosshatch(frame, w, h, p, c){
    var density = Math.round(p.density);
    var data = frame.data;
    ctx.fillStyle = c.bg; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = c.fg; ctx.lineWidth = 1;
    for (var y = 0; y < h; y += p.cell) {
      for (var x = 0; x < w; x += p.cell) {
        var idx = (y*w+x)*4;
        var l = luma(data[idx], data[idx+1], data[idx+2]) / 255;
        var lines = Math.round((1-l) * density);
        for (var n = 0; n < lines; n++) {
          ctx.beginPath(); ctx.moveTo(x, y + (n+1)*(p.cell/(density+1))); ctx.lineTo(x+p.cell, y + (n+1)*(p.cell/(density+1)) - p.cell*0.3); ctx.stroke();
          if (n >= 2) { ctx.beginPath(); ctx.moveTo(x, y + p.cell - (n-1)*(p.cell/(density+1))); ctx.lineTo(x+p.cell, y + p.cell - (n-1)*(p.cell/(density+1)) + p.cell*0.3); ctx.stroke(); }
        }
      }
    }
    return ctx.getImageData(0, 0, w, h);
  }

  function renderWaveLines(frame, w, h, p, c){
    var data = frame.data;
    ctx.fillStyle = c.bg; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = c.fg; ctx.lineWidth = 1.2;
    for (var y = 0; y < h; y += p.spacing) {
      ctx.beginPath();
      for (var x = 0; x < w; x++) {
        var idx = (y*w+x)*4;
        var l = luma(data[idx], data[idx+1], data[idx+2]) / 255;
        var yy = y + Math.sin(x*0.08) * p.amplitude * l;
        if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    return ctx.getImageData(0, 0, w, h);
  }

  function renderNoiseField(frame, w, h, p){
    var scale = Math.round(p.scale);
    var data = frame.data;
    var out = ctx.createImageData(w, h); var od = out.data;
    for (var by = 0; by < h; by += scale) {
      for (var bx = 0; bx < w; bx += scale) {
        var n2 = (Math.random()-0.5) * 255 * p.intensity;
        for (var y = by; y < Math.min(h, by+scale); y++) for (var x = bx; x < Math.min(w, bx+scale); x++) {
          var idx=(y*w+x)*4;
          od[idx]=Math.min(255,Math.max(0,data[idx]+n2)); od[idx+1]=Math.min(255,Math.max(0,data[idx+1]+n2)); od[idx+2]=Math.min(255,Math.max(0,data[idx+2]+n2)); od[idx+3]=255;
        }
      }
    }
    return out;
  }

  function renderVoronoi(frame, w, h, p){
    var cellSize = p.cell, edgeWidth = p.edgeWidth, randomize = p.randomize;
    var data = frame.data;
    var cols = Math.ceil(w/cellSize)+1, rows = Math.ceil(h/cellSize)+1;
    var sites = [];
    for (var ry = 0; ry < rows; ry++) for (var rx = 0; rx < cols; rx++) {
      var jx = (Math.random()-0.5) * cellSize * randomize, jy = (Math.random()-0.5) * cellSize * randomize;
      sites.push({ x: rx*cellSize + cellSize/2 + jx, y: ry*cellSize + cellSize/2 + jy });
    }
    var out = ctx.createImageData(w, h); var od = out.data;
    var siteColor = {};
    function colorAt(siteIdx){
      if (siteColor[siteIdx]) return siteColor[siteIdx];
      var sx = Math.min(w-1, Math.max(0, Math.round(sites[siteIdx].x))), sy = Math.min(h-1, Math.max(0, Math.round(sites[siteIdx].y)));
      var idx = (sy*w+sx)*4;
      var c = [data[idx], data[idx+1], data[idx+2]]; siteColor[siteIdx] = c; return c;
    }
    for (var y = 0; y < h; y++) {
      var rowIdx = Math.floor(y/cellSize);
      for (var x = 0; x < w; x++) {
        var colIdx = Math.floor(x/cellSize);
        var best = -1, bestD = Infinity, secondD = Infinity;
        for (var dry = -1; dry <= 1; dry++) for (var drx = -1; drx <= 1; drx++) {
          var cc = colIdx+drx, cr = rowIdx+dry;
          if (cc<0||cc>=cols||cr<0||cr>=rows) continue;
          var sidx = cr*cols+cc, s = sites[sidx], dx = s.x-x, dy = s.y-y, d = dx*dx+dy*dy;
          if (d < bestD) { secondD = bestD; bestD = d; best = sidx; } else if (d < secondD) secondD = d;
        }
        var idx = (y*w+x)*4;
        if (edgeWidth > 0 && (Math.sqrt(secondD) - Math.sqrt(bestD)) < edgeWidth*3) { od[idx]=15; od[idx+1]=46; od[idx+2]=39; }
        else { var c = colorAt(best); od[idx]=c[0]; od[idx+1]=c[1]; od[idx+2]=c[2]; }
        od[idx+3]=255;
      }
    }
    return out;
  }

  function renderVHS(frame, w, h, p){
    var out = ctx.createImageData(w, h);
    var data = frame.data, od = out.data;
    for (var y = 0; y < h; y++) {
      var shift = Math.round(Math.sin(y * 0.3) * p.intensity * 0.3 + (Math.random()-0.5)*p.intensity*0.4);
      for (var x = 0; x < w; x++) {
        var idx = (y * w + x) * 4;
        var rx = Math.min(w-1, Math.max(0, x + shift)), bx = Math.min(w-1, Math.max(0, x - shift));
        var rIdx = (y*w+rx)*4, bIdx = (y*w+bx)*4;
        od[idx] = data[rIdx]; od[idx+1] = data[idx+1]; od[idx+2] = data[bIdx+2];
        var lineDark = (y % 2 === 0) ? (1 - p.scanline) : 1;
        od[idx] *= lineDark; od[idx+1] *= lineDark; od[idx+2] *= lineDark; od[idx+3] = 255;
      }
    }
    return out;
  }

  var matrixCols = null;
  function renderMatrix(frame, w, h, p, c){
    ctx.putImageData(frame, 0, 0);
    var bgRgb = hexToRgb(c.bg), fgRgb = hexToRgb(c.fg);
    ctx.fillStyle = "rgba(" + bgRgb.r + "," + bgRgb.g + "," + bgRgb.b + "," + Math.min(0.85, p.opacity) + ")";
    ctx.fillRect(0,0,w,h);
    var glyphs = "01アイウエオカキクケコサシスセソ";
    ctx.font = p.density + "px monospace";
    ctx.fillStyle = "rgba(" + fgRgb.r + "," + fgRgb.g + "," + fgRgb.b + "," + p.opacity + ")";
    var cols = Math.floor(w / p.density);
    if (!matrixCols || matrixCols.length !== cols) { matrixCols = []; for (var c2 = 0; c2 < cols; c2++) matrixCols.push(Math.floor(Math.random() * (h/p.density))); }
    for (var c3 = 0; c3 < cols; c3++) {
      var x = c3 * p.density;
      var dropLen = 6 + Math.floor(Math.random()*10);
      for (var r = 0; r < dropLen; r++) {
        var y = (matrixCols[c3] - r) * p.density;
        if (y < 0 || y > h) continue;
        var ch = glyphs[Math.floor(Math.random()*glyphs.length)];
        ctx.globalAlpha = Math.max(0, 1 - r/dropLen);
        ctx.fillText(ch, x, y);
      }
      matrixCols[c3] = (matrixCols[c3] + 1) % Math.ceil(h/p.density + dropLen);
    }
    ctx.globalAlpha = 1;
    return ctx.getImageData(0, 0, w, h);
  }

  /* ============ GALLERY (all effects, live thumbnails) ============ */
  var galleryOverlay = document.getElementById("galleryOverlay");
  var fxGrid = document.getElementById("fxGrid");
  document.getElementById("openGallery").addEventListener("click", function(){
    if (!srcImage) { fileInput.click(); return; }
    buildGallery();
    galleryOverlay.classList.add("open");
  });
  document.getElementById("closeGallery").addEventListener("click", function(){ galleryOverlay.classList.remove("open"); });
  galleryOverlay.addEventListener("click", function(e){ if (e.target === galleryOverlay) galleryOverlay.classList.remove("open"); });

  function buildGallery(){
    fxGrid.innerHTML = "";
    var THUMB = 140;
    var tmp = document.createElement("canvas"); tmp.width = THUMB; tmp.height = THUMB;
    var tmpCtx = tmp.getContext("2d");
    var s = Math.min(srcCanvas.width, srcCanvas.height);
    tmpCtx.drawImage(srcCanvas, (srcCanvas.width-s)/2, (srcCanvas.height-s)/2, s, s, 0, 0, THUMB, THUMB);
    var frame = tmpCtx.getImageData(0,0,THUMB,THUMB);

    var savedCanvas = canvas, savedCtx = ctx;
    canvas = tmp; ctx = tmpCtx;

    EFFECTS.forEach(function(fx){
      var out = applyEffect(fx.id, frame, THUMB, THUMB, paramVals(fx.id), COLORS[fx.id]);
      ctx.putImageData(out, 0, 0);
      var url = tmp.toDataURL("image/jpeg", 0.75);
      var cell = document.createElement("button");
      cell.className = "fx-cell" + (fx.id === activeFx ? " active" : "");
      cell.innerHTML = '<img src="'+url+'" alt="'+fx.label+'"><span>'+fx.label+'</span>';
      cell.addEventListener("click", function(){ selectFx(fx.id); galleryOverlay.classList.remove("open"); });
      fxGrid.appendChild(cell);
    });

    canvas = savedCanvas; ctx = savedCtx;
  }

  /* ============ EXPORT ============ */
  var exportOverlay = document.getElementById("exportOverlay");
  var exportFormat = "jpeg", exportScale = 2;
  exportBtn.addEventListener("click", function(){ if (!srcImage) return; exportOverlay.classList.add("open"); });
  document.getElementById("closeExport").addEventListener("click", function(){ exportOverlay.classList.remove("open"); });
  exportOverlay.addEventListener("click", function(e){ if (e.target === exportOverlay) exportOverlay.classList.remove("open"); });

  document.getElementById("formatSeg").addEventListener("click", function(e){
    var btn = e.target.closest("button"); if (!btn) return;
    Array.prototype.forEach.call(this.children, function(b){ b.classList.toggle("active", b === btn); });
    exportFormat = btn.dataset.v;
    document.getElementById("qualityField").style.display = exportFormat === "png" ? "none" : "block";
  });
  document.getElementById("scaleSeg").addEventListener("click", function(e){
    var btn = e.target.closest("button"); if (!btn) return;
    Array.prototype.forEach.call(this.children, function(b){ b.classList.toggle("active", b === btn); });
    exportScale = parseInt(btn.dataset.v, 10);
  });
  var qualitySlider = document.getElementById("qualitySlider");
  qualitySlider.addEventListener("input", function(){ document.getElementById("qualityVal").textContent = qualitySlider.value; });

  document.getElementById("downloadBtn").addEventListener("click", function(){
    if (!srcImage) return;
    var maxDim = 2200;
    var targetW = Math.min(maxDim, srcImage.width * exportScale);
    var ratio = targetW / srcImage.width;
    var targetH = Math.round(srcImage.height * ratio);
    targetW = Math.round(targetW);

    var full = document.createElement("canvas"); full.width = targetW; full.height = targetH;
    var fullCtx = full.getContext("2d");
    fullCtx.drawImage(srcImage, 0, 0, targetW, targetH);
    var frame = fullCtx.getImageData(0, 0, targetW, targetH);

    var savedCanvas = canvas, savedCtx = ctx;
    canvas = full; ctx = fullCtx;
    var scaleFactor = targetW / srcCanvas.width;
    var out = applyEffect(activeFx, frame, targetW, targetH, paramVals(activeFx, scaleFactor), COLORS[activeFx]);
    ctx.putImageData(out, 0, 0);
    canvas = savedCanvas; ctx = savedCtx;

    var mime = exportFormat === "png" ? "image/png" : exportFormat === "webp" ? "image/webp" : "image/jpeg";
    var quality = exportFormat === "png" ? undefined : parseFloat(qualitySlider.value);
    var dataUrl = full.toDataURL(mime, quality);

    var a = document.createElement("a");
    a.href = dataUrl;
    a.download = "bangaliicon-" + activeFx + "-" + targetW + "x" + targetH + "." + (exportFormat === "jpeg" ? "jpg" : exportFormat);
    a.click();

    exportOverlay.classList.remove("open");
    setCredits(fetchCredits() - CREDIT_COST);
    toast("Downloaded " + targetW + "×" + targetH + " · -" + CREDIT_COST + " credit");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  });

  /* ============ SEND TO BOT ============ */
  sendBtn.addEventListener("click", function(){
    if (!srcImage) return;
    if (fetchCredits() < CREDIT_COST) { toast("Not enough credits"); return; }
    if (tg && tg.sendData) {
      var payload = JSON.stringify({ effect: activeFx, params: paramVals(activeFx), colors: COLORS[activeFx] });
      if (payload.length <= 4000) {
        tg.sendData(payload);
        setCredits(fetchCredits() - CREDIT_COST);
        setStatus("sent to bot — generating full-res on server");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } else {
        toast("Settings too large — simplify and retry");
      }
    } else {
      toast("Open inside Telegram to send to the bot");
    }
  });

  buildControls();
})();
</script>
</body>
